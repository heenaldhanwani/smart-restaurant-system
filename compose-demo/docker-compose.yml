services:
  web:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: database
  redis:
    image: redis
